[project]
name = "sast-bench"
version = "0.1.0"
description = "Benchmark de escaneres de seguridad sobre vulnerabilidades de Angular"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "semgrep>=1.177",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["runners", "scoring"]
