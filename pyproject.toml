[project]
name = "sast-bench"
version = "0.1.0"
description = "Benchmark of security scanners on Angular vulnerabilities"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "openai>=3.22.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "semgrep>=1.177",
    "tree-sitter>=0.26.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
sast-bench = "sast_bench.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["auditor", "runners", "scoring", "scripts", "sast_bench"]
