# rule_id -> familia, para CodeQL. Mantenido a mano y versionado.
#
# Los ids son los de SARIF (`js/xss`), que CodeQL publica tal cual. Cualquier
# rule_id que aparezca en una corrida y no este ni en `rules` ni en `ignore` se
# reporta como unmapped: cuenta como ruido, no entra en TP/FP, y el reporte lo
# lista para que no se ignore por omision.
meta:
  tool: codeql
  rules_source: "github/codeql-action@codeql-bundle-v2.27.1 (javascript-security-extended)"
  mapped_at: "2026-09-23"

rules:
  # Taint de fuente remota a un sink de DOM/HTML.
  js/xss: xss-sanitizer-bypass
  js/xss-through-dom: xss-sanitizer-bypass
  js/html-constructed-from-input: xss-sanitizer-bypass
  js/unsafe-jquery-plugin: xss-sanitizer-bypass
  # Validacion insuficiente: son las que apuntan a los decoy.
  js/incomplete-url-substring-sanitization: xss-sanitizer-bypass
  js/incomplete-multi-character-sanitization: xss-sanitizer-bypass
  # Aparecio como unmapped en la corrida del 2026-09-22 sobre ng-xss-011:
  # marca el regex que intenta filtrar etiquetas HTML. Es la familia.
  js/bad-tag-filter: xss-sanitizer-bypass
  js/incomplete-sanitization: xss-sanitizer-bypass
  js/incomplete-hostname-regexp: xss-sanitizer-bypass
  # La familia incluye "URLs sin validar esquema".
  js/client-side-unvalidated-url-redirection: xss-sanitizer-bypass

  # --- client-side-secrets ---
  # Sembradas antes de la primera corrida sobre la familia, leyendo la suite
  # javascript-security-extended. Las que no disparen quedan igual: el costo
  # de mapear de mas es cero, el de no mapear es contar un TP como ruido.
  js/clear-text-storage-of-sensitive-data: client-side-secrets
  js/clear-text-logging: client-side-secrets
  js/hardcoded-credentials: client-side-secrets
  js/sensitive-get-query: client-side-secrets
  js/build-artifact-leak: client-side-secrets
  js/password-in-configuration-file: client-side-secrets
  js/empty-password-in-configuration-file: client-side-secrets
  # Versiones extendidas de runners/codeql-ext/ (suman accessToken, jwt,
  # bearer, etc. a la heuristica de nombres). Solo aparecen en codeql+ext.
  sast-bench/clear-text-storage-ext: client-side-secrets
  sast-bench/clear-text-logging-ext: client-side-secrets

ignore: []
