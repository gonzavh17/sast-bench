# rule_id -> family, for CodeQL. Maintained by hand and versioned.
#
# Ids are the SARIF ones (`js/xss`), which CodeQL publishes as is. Any rule_id
# that shows up in a run and is in neither `rules` nor `ignore` is reported as
# unmapped: it counts as noise, stays out of TP/FP, and the report lists it so
# it is never ignored by omission.
meta:
  tool: codeql
  rules_source: "github/codeql-action@codeql-bundle-v2.27.1 (javascript-security-extended)"
  mapped_at: "2026-09-23"

rules:
  # Taint from a remote source to a DOM/HTML sink.
  js/xss: xss-sanitizer-bypass
  js/xss-through-dom: xss-sanitizer-bypass
  js/html-constructed-from-input: xss-sanitizer-bypass
  js/unsafe-jquery-plugin: xss-sanitizer-bypass
  # Insufficient validation: these are the ones aimed at the decoys.
  js/incomplete-url-substring-sanitization: xss-sanitizer-bypass
  js/incomplete-multi-character-sanitization: xss-sanitizer-bypass
  # Showed up as unmapped in the 2026-09-22 run on ng-xss-011: it flags the
  # regex that tries to filter HTML tags. It belongs to the family.
  js/bad-tag-filter: xss-sanitizer-bypass
  js/incomplete-sanitization: xss-sanitizer-bypass
  js/incomplete-hostname-regexp: xss-sanitizer-bypass
  # The family includes "URLs with an unvalidated scheme".
  js/client-side-unvalidated-url-redirection: xss-sanitizer-bypass

  # --- client-side-secrets ---
  # Seeded before the first run on the family, reading the
  # javascript-security-extended suite. The ones that never fire stay anyway: the
  # cost of over-mapping is zero, the cost of not mapping is counting a TP as noise.
  js/clear-text-storage-of-sensitive-data: client-side-secrets
  js/clear-text-logging: client-side-secrets
  js/hardcoded-credentials: client-side-secrets
  js/sensitive-get-query: client-side-secrets
  js/build-artifact-leak: client-side-secrets
  js/password-in-configuration-file: client-side-secrets
  js/empty-password-in-configuration-file: client-side-secrets
  # Extended versions from runners/codeql-ext/ (they add accessToken, jwt,
  # bearer, etc. to the name heuristic). They only show up in codeql+ext.
  sast-bench/clear-text-storage-ext: client-side-secrets
  sast-bench/clear-text-logging-ext: client-side-secrets

  # --- broken-authorization ---
  # Seeded before the first run on the family. See
  # results/prediccion-authz.md: they are not expected to fire.
  js/user-controlled-bypass: broken-authorization
  js/jwt-missing-verification: broken-authorization
  # js/client-side-request-forgery is left unmapped on purpose (CWE-918, not
  # authorization). If it fires, it shows up as noise and gets decided with data.

ignore: []
