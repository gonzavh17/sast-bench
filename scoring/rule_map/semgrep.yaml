# rule_id -> family, for Semgrep. Maintained by hand and versioned.
#
# Ids are the short ones (without the path prefix Semgrep puts in front of the
# check_id). Any rule_id that shows up in a run and is in neither `rules` nor
# `ignore` is reported as unmapped: it counts as noise, stays out of TP/FP, and
# the report lists it so it is never ignored by omission.
meta:
  tool: semgrep
  rules_source: "semgrep/semgrep-rules@40b8c63f75dc7c22c8a77482d73bfb864b146f7e"
  mapped_at: "2026-09-23"

rules:
  # They fire on the current corpus.
  insecure-innerhtml: xss-sanitizer-bypass
  insecure-document-method: xss-sanitizer-bypass
  # Its pattern-sources only accepts a function parameter typed string, never
  # ActivatedRoute or a class property. It fires on ng-xss-005 (standalone
  # function) and ng-xss-006 (a pipe's transform method: Semgrep normalizes class
  # methods to function definitions, so they match too).
  angular-bypasssecuritytrust: xss-sanitizer-bypass

  # --- client-side-secrets ---
  # None applies to idiomatic Angular (they are for Express, passport,
  # jsonwebtoken, HMAC, or require importing jwt-decode), but they are mapped so
  # that if one fires it counts as a detection and not as noise.
  express-jwt-hardcoded-secret: client-side-secrets
  express-session-hardcoded-secret: client-side-secrets
  hardcoded-jwt-secret: client-side-secrets
  hardcoded-passport-secret: client-side-secrets
  hardcoded-hmac-key: client-side-secrets
  react-jwt-in-localstorage: client-side-secrets

  # --- broken-authorization ---
  # Both require a JWT library; the cases decode with atob.
  jwt-decode-without-verify: broken-authorization
  react-jwt-decoded-property: broken-authorization

ignore:
  # Correctness rule, not security. First seen on ng-authz-004 (2026-09-25):
  # it reads Angular's {{ u.email }} inside a TS template literal as a JS
  # template string missing its `$`.
  - missing-template-string-indicator
