id: ngh-authz-001
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/checkout.service.ts, line: 16}
    rationale: >
      The order is sent with prices and a total computed in the browser. If the
      backend charges what the client says, anyone can edit unitPrice or total in
      the request and pay what they want: the client asserts something only the
      server should decide.
  safe:
    label: safe
    rationale: >
      Same order and same endpoint. Only SKUs and quantities are sent; prices and
      the total are for the server to compute.
