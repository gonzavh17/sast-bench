id: ng-sec-001
ecosystem: angular
family: client-side-secrets
cwe: CWE-798
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/environment.ts, line: 5}
    rationale: >
      environment.ts se compila dentro del bundle que baja el navegador, asi que
      la clave secreta de Stripe queda legible para cualquiera que abra las
      herramientas del navegador. El servicio la manda en un header Authorization,
      pero el problema es que el valor este del lado del cliente.
  safe:
    label: safe
    rationale: >
      environment.ts solo tiene la URL base. El cobro lo hace el backend, que es
      el unico que conoce la clave, y la sesion viaja en una cookie httpOnly que
      el JavaScript de la pagina no puede leer.
