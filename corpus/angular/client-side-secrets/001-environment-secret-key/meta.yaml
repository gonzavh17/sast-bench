id: ng-sec-001
ecosystem: angular
family: client-side-secrets
cwe: CWE-798
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/environment.ts, line: 5}
    rationale: >
      environment.ts is compiled into the bundle the browser downloads, so the
      Stripe secret key is readable by anyone who opens the browser's dev tools.
      The service sends it in an Authorization header, but the problem is that the
      value lives on the client side at all.
  safe:
    label: safe
    rationale: >
      environment.ts only has the base URL. The charge is made by the backend, the
      only one that knows the key, and the session travels in an httpOnly cookie
      that the page's JavaScript cannot read.
