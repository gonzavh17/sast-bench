id: ng-sec-006
ecosystem: angular
family: client-side-secrets
cwe: CWE-532
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/error.interceptor.ts, line: 11}
    rationale: >
      The interceptor logs req.body of every failed request. The login component
      logs nothing, but it sends the password in the body: if the login fails, the
      password ends up in the console. The component and the interceptor are in
      different files and neither looks odd on its own.
  safe:
    label: safe
    rationale: >
      Same interceptor, same catchError, same console.error. It logs the URL and
      the status, which is what helps with diagnosis, and not the body.
