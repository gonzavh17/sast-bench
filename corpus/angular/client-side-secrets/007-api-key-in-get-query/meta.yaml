id: ng-sec-007
ecosystem: angular
family: client-side-secrets
cwe: CWE-598
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/url-builder.ts, line: 3}
    rationale: >
      The key comes from environment.ts, goes through the service and ends up in
      the query string built by a helper. Full URLs are kept in the browser
      history, in the Referer header and in the logs of any proxy on the way. The
      helper receives a string called apiKey and does not know where it comes
      from.
  safe:
    label: safe
    rationale: >
      Same helper with one parameter less and the same call. The credential does
      not travel in the URL: the session goes in an httpOnly cookie.
