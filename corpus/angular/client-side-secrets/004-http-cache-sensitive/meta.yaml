id: ng-sec-004
ecosystem: angular
family: client-side-secrets
cwe: CWE-524
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/cache.interceptor.ts, line: 21}
    rationale: >
      The interceptor caches every GET response without looking at which endpoint
      it comes from, so /api/me and any authenticated resource are kept in memory
      shared by the whole application, even after logging out.
  safe:
    label: safe
    rationale: >
      Same interceptor and same cache, with an explicit list of public endpoints
      compared against the parsed pathname. Authenticated responses never get in.
