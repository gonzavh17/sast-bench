id: ng-sec-010
ecosystem: angular
family: client-side-secrets
cwe: CWE-532
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/session-debug.service.ts, line: 13}
    rationale: >
      It looks like a harmless development log, but no build removes
      console.debug: the level is filtered by the browser console at runtime, not
      by the compiler. In production it prints the access token.
  safe:
    label: safe
    rationale: >
      Same console.debug, same message, same service. Two minimal changes: an
      early return with isDevMode(), which is resolved at build time, and logging
      the userId instead of the whole session.
