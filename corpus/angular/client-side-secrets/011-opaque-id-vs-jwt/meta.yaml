id: ng-sec-011
ecosystem: angular
family: client-side-secrets
cwe: CWE-922
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/session-store.service.ts, line: 7}
    rationale: >
      Both variants store something called session_token in sessionStorage and
      look almost identical. This one stores the full JWT: whoever reads it can
      act as the user until it expires.
  safe:
    label: safe
    rationale: >
      Same storage, same key, same signature. It stores only the first eight
      characters, which the backend uses as an opaque reference to resume the UI.
      It authenticates nothing: without the httpOnly cookie it is useless.
