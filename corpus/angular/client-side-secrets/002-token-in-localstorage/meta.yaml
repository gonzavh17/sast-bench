id: ng-sec-002
ecosystem: angular
family: client-side-secrets
cwe: CWE-922
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/auth.service.ts, line: 12}
    rationale: >
      The access token is persisted in localStorage, which never expires, survives
      closing the browser and is readable by any script running on the origin. A
      single XSS on any page of the site takes the session.
  safe:
    label: safe
    rationale: >
      Same login, same response. The token stays in a private field of the
      service: it lives in memory, dies on reload, and no script can read it from
      elsewhere.
