id: ng-sec-005
ecosystem: angular
family: client-side-secrets
cwe: CWE-922
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/session.service.ts, line: 13}
    rationale: >
      StorageService es un envoltorio generico que no sabe que le estan pasando:
      recibe una clave y un valor. El que decide guardar la credencial es
      SessionService, en otro archivo. Ninguno de los dos contiene el problema
      completo.
  safe:
    label: safe
    rationale: >
      Mismo envoltorio, mismo llamador, misma llamada a save(). Lo que cambia es
      que baja al disco: la preferencia de idioma en vez del token, que queda en
      un campo privado en memoria.
