id: ng-sec-005
ecosystem: angular
family: client-side-secrets
cwe: CWE-922
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/session.service.ts, line: 13}
    rationale: >
      StorageService is a generic wrapper that does not know what it is given: it
      takes a key and a value. The one that decides to store the credential is
      SessionService, in another file. Neither of them contains the whole problem.
  safe:
    label: safe
    rationale: >
      Same wrapper, same caller, same call to save(). What changes is what goes to
      disk: the language preference instead of the token, which stays in a private
      field in memory.
