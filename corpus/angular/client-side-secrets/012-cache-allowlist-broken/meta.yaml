id: ng-sec-012
ecosystem: angular
family: client-side-secrets
cwe: CWE-524
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/public-cache.interceptor.ts, line: 11}
    rationale: >
      There is a visible allowlist with the right name, but includes() looks for
      the text anywhere in the URL. /api/me?redirect=/public/home gets into the
      cache, and so does any endpoint whose path contains that fragment further
      along.
  safe:
    label: safe
    rationale: >
      Same cache, same method name, same idea. It parses the URL and asks whether
      the pathname starts with /public/, which is what the check meant to say.
