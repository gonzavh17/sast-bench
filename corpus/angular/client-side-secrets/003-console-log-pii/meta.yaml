id: ng-sec-003
ecosystem: angular
family: client-side-secrets
cwe: CWE-532
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/profile.component.ts, line: 17}
    rationale: >
      The whole profile object is logged, including email, national id and
      password. It ends up in every user's browser console and in any monitoring
      tool that captures the console.
  safe:
    label: safe
    rationale: >
      Same log on the same line, with the id instead of the object. An opaque
      identifier is enough to correlate and exposes nothing.
