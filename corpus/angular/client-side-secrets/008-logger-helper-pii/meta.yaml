id: ng-sec-008
ecosystem: angular
family: client-side-secrets
cwe: CWE-532
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/checkout.service.ts, line: 14}
    rationale: >
      logEvent serializes whatever it gets with JSON.stringify, and the service
      passes it the whole customer object, which includes the card number. The
      helper is generic and the service never mentions the console: the problem
      only exists when both come together.
  safe:
    label: safe
    rationale: >
      Same helper and same call, passing the customer id instead of the object.
