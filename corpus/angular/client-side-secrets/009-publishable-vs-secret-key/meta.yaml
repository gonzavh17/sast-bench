id: ng-sec-009
ecosystem: angular
family: client-side-secrets
cwe: CWE-798
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/environment.ts, line: 5}
    rationale: >
      Both variants put a Stripe key in the environment and pass it to the SDK the
      same way. The difference is the prefix: sk_live_ is the server key and gives
      full access to the account. No key with that prefix should be on the client
      side.
  safe:
    label: safe
    rationale: >
      Same shape, same field name, same use. pk_live_ is the publishable key,
      designed to live in the browser: it only allows tokenizing a card and cannot
      read or charge anything on its own. A key in the bundle is not automatically
      a flaw.
