id: ng-xss-001
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/profile.component.ts, line: 19}
    rationale: >
      bypassSecurityTrustHtml applied to the `bio` query param without sanitizing.
      The resulting SafeHtml is bound with [innerHTML], so Angular injects the
      markup as is and escapes nothing.
  safe:
    label: safe
    rationale: >
      Same render without DomSanitizer: the query param is stored as a string and
      interpolated with {{ bio }}, which Angular escapes by default.
