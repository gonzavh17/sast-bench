id: ng-xss-004
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/profile.component.ts, line: 19}
    rationale: >
      The `bio` query param is read by ProfileBioService, not by the component.
      The component gets the service injected and passes currentBio() straight to
      bypassSecurityTrustHtml. No single file holds the whole chain: the source is
      in the service and the sink in the component.
  safe:
    label: safe
    rationale: >
      Same service and same injection, but the component stores the string and
      interpolates it with {{ bio }}. DomSanitizer is taken out of the picture:
      the indirection stays the same, the only change is that the value is never
      marked as trusted.

