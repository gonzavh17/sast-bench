id: ng-xss-007
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/snippet.component.ts, line: 16}
    rationale: >
      The parent reads the `snippet` query param and passes it through [html] to
      the child. The child bypasses its @Input() in ngOnChanges. The crossing
      happens in the parent's template, so no .ts file contains the whole path.
  safe:
    label: safe
    rationale: >
      Same parent, same @Input(), same [innerHTML] binding in the child. The child
      stops injecting DomSanitizer and binds the raw string: since it is not a
      SafeHtml, Angular sanitizes it before inserting it.

