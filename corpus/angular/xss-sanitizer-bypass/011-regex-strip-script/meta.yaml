id: ng-xss-011
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/trusted-html.ts, line: 8}
    rationale: >
      There is visible cleanup, but removing <script> does not remove what runs JS
      through attributes: `<img src=x onerror=alert(1)>` has no script tag and
      still runs. The regex also misses `javascript:` in href and nested tags that
      reassemble when the inner one is removed.
  safe:
    label: safe
    rationale: >
      Same helper, same signature, same bypass on the result. One line changes:
      sanitize(SecurityContext.HTML, html) instead of the regex. Angular's
      sanitizer removes on* handlers and dangerous schemes, not just tags.

