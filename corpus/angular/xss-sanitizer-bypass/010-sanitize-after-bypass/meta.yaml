id: ng-xss-010
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/trusted-html.ts, line: 6}
    rationale: >
      The helper calls the sanitizer, but too late. Wrapping with
      bypassSecurityTrustHtml marks the value as already reviewed, and sanitize()
      on a marked value returns it untouched: `cleaned` ends up being the original
      markup. The call to sanitize() is in plain sight and does nothing.
  safe:
    label: safe
    rationale: >
      The same three lines, reversed: first sanitize() on the raw string, then the
      bypass on the clean result. It is the only difference between the twins, and
      it decides whether the sanitizer looks at the value or not.

