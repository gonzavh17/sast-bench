id: ng-xss-009
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/preview.component.ts, line: 24}
    rationale: >
      There is visible validation against the right constant, but startsWith
      compares text and a domain is read right to left:
      `https://cdn.example.com.attacker.example/x` passes the check and belongs to
      attacker.example. bypassSecurityTrustResourceUrl puts that origin inside an
      iframe, so the attacker controls the frame's content.
  safe:
    label: safe
    rationale: >
      Same constant, same bypass, same iframe. The difference is that it compares
      `new URL(raw).origin`: the browser's parser decides where the host ends, and
      `cdn.example.com.attacker.example` does not equal the allowed origin.

