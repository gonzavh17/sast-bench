id: ng-xss-008
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/changelog.component.ts, line: 15}
    rationale: >
      insertAdjacentHTML parses the string as markup and inserts it into the DOM
      without going through Angular's sanitizer, just like .innerHTML. The value
      comes from the `entry` query param.
  safe:
    label: safe
    rationale: >
      insertAdjacentText at the same position of the same node. It is the only
      difference between the twins: it inserts the value as text and never parses
      it as HTML.

