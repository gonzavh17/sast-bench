id: ng-xss-006
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/safe-html.pipe.ts, line: 9}
    rationale: >
      The safeHtml pipe bypasses everything that comes in, and the template
      applies it to the `body` query param. The component never touches
      DomSanitizer: the unsafe decision is in the pipe and the dangerous data
      arrives through the template, which is where both halves meet.
  safe:
    label: safe
    rationale: >
      Same pipe, same name, same use in the template. transform() returns
      sanitize(SecurityContext.HTML, value): the pipe still exists and the
      indirection is identical, it just stops marking the value as trusted.

