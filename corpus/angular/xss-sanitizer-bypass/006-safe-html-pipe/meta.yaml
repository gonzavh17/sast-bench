id: ng-xss-006
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/safe-html.pipe.ts, line: 9}
    rationale: >
      El pipe safeHtml bypasea todo lo que le entra, y el template se lo aplica
      al query param `body`. El componente no toca el DomSanitizer: la decision
      insegura esta en el pipe y el dato peligroso llega por el template, que es
      donde se unen las dos mitades.
  safe:
    label: safe
    rationale: >
      Mismo pipe, mismo nombre, mismo uso en el template. transform() devuelve
      sanitize(SecurityContext.HTML, value): el pipe sigue existiendo y la
      indireccion es identica, solo deja de marcar como confiable.

