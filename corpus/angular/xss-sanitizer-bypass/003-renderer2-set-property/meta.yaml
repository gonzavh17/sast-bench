id: ng-xss-003
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/banner.component.ts, line: 18}
    rationale: >
      Renderer2.setProperty with the 'innerHTML' property writes raw markup
      without going through the sanitizer. Coming from the framework API adds no
      protection: it is the same as touching the DOM by hand.
  safe:
    label: safe
    rationale: >
      The same Renderer2.setProperty targeting 'textContent'. It is the only
      difference between the twins, and it is enough for the value never to be
      interpreted as HTML.
