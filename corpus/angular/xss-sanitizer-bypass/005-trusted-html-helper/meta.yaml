id: ng-xss-005
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/trusted-html.ts, line: 5}
    rationale: >
      toTrustedHtml() applies bypassSecurityTrustHtml to any string it receives.
      The component reads the `body` query param and hands it over. The helper
      does not know where the data comes from and the component does not know the
      helper bypasses: the flaw only exists when both files come together.
  safe:
    label: safe
    rationale: >
      Helper with the same signature and the same caller, but it returns
      sanitize(SecurityContext.HTML, html) instead of marking the value as
      trusted. When a string (not a SafeHtml) is bound with [innerHTML], Angular
      sanitizes it again on its own.

