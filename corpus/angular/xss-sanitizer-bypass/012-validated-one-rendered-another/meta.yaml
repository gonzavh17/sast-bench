id: ng-xss-012
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/summary.component.ts, line: 23}
    rationale: >
      The sanitizer is really called, on the right value, but the result stays in
      `clean` and is only used for the if. What gets wrapped and ends up in the
      DOM is `raw`, the untouched original: the cleanup is computed and thrown
      away.
  safe:
    label: safe
    rationale: >
      Identical except for the identifier passed to the bypass: `clean` instead of
      `raw`. One word of difference between a safe component and an exploitable
      one.

