id: ng-xss-002
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/note.component.ts, line: 15}
    rationale: >
      El query param `note` se escribe en .innerHTML del nativeElement
      obtenido por ViewChild. Al tocar el DOM directo se esquiva el
      sanitizador de Angular, que solo interviene en los bindings.
  safe:
    label: safe
    rationale: >
      Mismo acceso por ElementRef pero asignando .textContent, que trata
      el valor como texto y nunca lo parsea como markup.
