id: ng-xss-002
ecosystem: angular
family: xss-sanitizer-bypass
cwe: CWE-79
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/note.component.ts, line: 15}
    rationale: >
      The `note` query param is written into .innerHTML of the nativeElement
      obtained through ViewChild. Touching the DOM directly bypasses Angular's
      sanitizer, which only steps in on bindings.
  safe:
    label: safe
    rationale: >
      Same ElementRef access but assigning .textContent, which treats the value as
      text and never parses it as markup.
