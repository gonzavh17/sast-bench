id: ng-authz-012
ecosystem: angular
family: broken-authorization
cwe: CWE-639
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/settings.component.ts, line: 19}
    rationale: >
      The page is protected by a correct guard against /api/me: only a logged-in
      user gets in. But the id of the account to delete comes from ?user= in the
      URL. Being logged in is not the same as being the owner: any user can delete
      another.
  safe:
    label: safe
    rationale: >
      Same guard, same route, same DELETE. The id comes from /api/me: the user can
      only target their own account.
