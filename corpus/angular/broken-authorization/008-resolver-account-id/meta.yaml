id: ng-authz-008
ecosystem: angular
family: broken-authorization
cwe: CWE-639
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/account.service.ts, line: 14}
    rationale: >
      The accountId comes from the URL, the resolver reads it and passes it to the
      service, which builds /api/accounts/:id. Changing the number in the URL
      loads someone else's account. The chain goes through route, resolver and
      service; the component only receives the data.
  safe:
    label: safe
    rationale: >
      Same resolver, same service, same component. The route no longer carries an
      id and the service requests /api/me/account: the server picks the account.
