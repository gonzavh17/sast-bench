id: ng-authz-007
ecosystem: angular
family: broken-authorization
cwe: CWE-639
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/identity.interceptor.ts, line: 12}
    rationale: >
      OrdersService pide /api/orders sin decir de quien: la identidad la agrega el
      interceptor en un header X-User-Id leido de localStorage. Cambiar ese valor
      en el storage hace que cada request de la app hable en nombre de otro
      usuario. El servicio que pide los datos no muestra nada raro.
  safe:
    label: safe
    rationale: >
      Mismo servicio, mismo interceptor registrado. El interceptor solo manda la
      cookie de sesion; quien es el usuario lo decide el servidor.
