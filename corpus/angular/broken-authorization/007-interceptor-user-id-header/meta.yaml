id: ng-authz-007
ecosystem: angular
family: broken-authorization
cwe: CWE-639
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/identity.interceptor.ts, line: 12}
    rationale: >
      OrdersService requests /api/orders without saying for whom: the identity is
      added by the interceptor in an X-User-Id header read from localStorage.
      Changing that value in storage makes every request of the app speak for
      another user. The service requesting the data shows nothing unusual.
  safe:
    label: safe
    rationale: >
      Same service, same registered interceptor. The interceptor only sends the
      session cookie; the server decides who the user is.
