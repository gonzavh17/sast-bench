id: ng-authz-011
ecosystem: angular
family: broken-authorization
cwe: CWE-347
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/admin.guard.ts, line: 12}
    rationale: >
      It looks like full validation: it checks there is a token, that it has not
      expired and that the role is admin. But it never verifies the signature. A
      hand-crafted token with a future exp and role:admin passes every check.
  safe:
    label: safe
    rationale: >
      Same presence and expiry checks, used only to bail out early. The role is
      answered by /api/session, which validates the token's signature on the
      server.
