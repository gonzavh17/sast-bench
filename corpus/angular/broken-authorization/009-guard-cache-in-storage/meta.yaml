id: ng-authz-009
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/admin.guard.ts, line: 11}
    rationale: >
      El guard si consulta /api/me, pero guarda el rol en localStorage y lo lee
      primero en la proxima navegacion. Escribir me_role=admin en el storage
      saltea la consulta al servidor. La validacion existe; el cache la anula.
  safe:
    label: safe
    rationale: >
      Mismo guard, misma consulta, mismo cache. El cache vive en una variable del
      modulo: dura lo que la pestana y no hay storage donde escribirlo.
