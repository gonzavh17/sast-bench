id: ng-authz-009
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/admin.guard.ts, line: 11}
    rationale: >
      The guard does call /api/me, but it stores the role in localStorage and
      reads it first on the next navigation. Writing me_role=admin into storage
      skips the call to the server. The validation exists; the cache defeats it.
  safe:
    label: safe
    rationale: >
      Same guard, same call, same cache. The cache lives in a module variable: it
      lasts as long as the tab and there is no storage to write it to.
