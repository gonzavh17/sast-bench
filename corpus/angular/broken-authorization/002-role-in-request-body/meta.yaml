id: ng-authz-002
ecosystem: angular
family: broken-authorization
cwe: CWE-807
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/refund.service.ts, line: 10}
    rationale: >
      El pedido de reembolso viaja con el rol que el cliente dice tener, leido de
      localStorage. Si el backend usa ese campo para autorizar, cualquier usuario
      se declara 'admin' editando el storage o el body del request.
  safe:
    label: safe
    rationale: >
      Mismo endpoint, mismo body salvo el rol. La identidad viaja en la cookie de
      sesion y el servidor deriva el rol de ella: el cliente no afirma nada.
