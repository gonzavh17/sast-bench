id: ng-authz-002
ecosystem: angular
family: broken-authorization
cwe: CWE-807
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/refund.service.ts, line: 10}
    rationale: >
      The refund request travels with the role the client claims to have, read
      from localStorage. If the backend uses that field to authorize, any user can
      declare themselves 'admin' by editing the storage or the request body.
  safe:
    label: safe
    rationale: >
      Same endpoint, same body except for the role. The identity travels in the
      session cookie and the server derives the role from it: the client asserts
      nothing.
