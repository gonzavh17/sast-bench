id: ng-authz-003
ecosystem: angular
family: broken-authorization
cwe: CWE-639
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/invoices.component.ts, line: 21}
    rationale: >
      The id of the user whose invoices are requested comes from the URL
      (/users/:userId). Changing the number in the address bar requests someone
      else's invoices: the screen leaves it to the client to choose whose data it
      is.
  safe:
    label: safe
    rationale: >
      Same screen, same invoices. The /api/me/invoices route carries no id: the
      server resolves the owner from the session.
