id: ng-authz-006
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/auth.service.ts, line: 9}
    rationale: >
      readClaims decodes the JWT payload with atob, without verifying the
      signature (a browser cannot). AuthService uses that 'role' claim to decide
      whether the user is an admin, and the guard trusts AuthService. A hand-
      crafted token with role:admin gets through.
  safe:
    label: safe
    rationale: >
      The same helper is still used, but only to show the name on screen. The
      admin decision comes from /api/me. It measures whether the tool tells
      decoding to display apart from decoding to authorize.
