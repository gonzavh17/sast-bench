id: ng-authz-004
ecosystem: angular
family: broken-authorization
cwe: CWE-807
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/dashboard.component.ts, line: 25}
    rationale: >
      Admin mode is turned on with ?admin=1 in the URL. It shows the user list and
      the ban button to anyone who adds the parameter.
  safe:
    label: safe
    rationale: >
      Same template, same actions. The mode comes from the role /api/me returns:
      the URL takes no part in the decision.
