id: ng-authz-005
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/role.service.ts, line: 7}
    rationale: >
      Cuatro archivos: la ruta pide el rol 'finance', el guard compara contra lo
      que devuelve RoleService, y RoleService lo lee de localStorage. Ni el guard
      ni la ruta muestran de donde sale el rol; el problema esta en el servicio.
  safe:
    label: safe
    rationale: >
      Misma ruta, mismo guard, misma firma de currentRole(). El servicio pide el
      rol a /api/me en vez de leerlo del storage.
