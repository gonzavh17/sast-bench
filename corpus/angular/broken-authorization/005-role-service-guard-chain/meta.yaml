id: ng-authz-005
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: indirect
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/role.service.ts, line: 7}
    rationale: >
      Four files: the route asks for the 'finance' role, the guard compares
      against what RoleService returns, and RoleService reads it from
      localStorage. Neither the guard nor the route shows where the role comes
      from; the problem is in the service.
  safe:
    label: safe
    rationale: >
      Same route, same guard, same currentRole() signature. The service asks
      /api/me for the role instead of reading it from storage.
