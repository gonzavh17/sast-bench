id: ng-authz-010
ecosystem: angular
family: broken-authorization
cwe: CWE-639
difficulty: decoy
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/invoice-detail.component.ts, line: 31}
    rationale: >
      There is an owner check (ownerId !== me.id) and it redirects to /forbidden.
      But the invoice has already reached the browser: the response of
      /api/invoices/:id sits in the network tab. The control is on the wrong side
      of the network.
  safe:
    label: safe
    rationale: >
      Same id from the URL, same redirect. It requests /api/me/invoices/:id: if
      the invoice is not the user's, the server answers 404 and the data never
      leaves.
