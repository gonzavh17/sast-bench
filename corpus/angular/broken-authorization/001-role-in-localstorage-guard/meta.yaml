id: ng-authz-001
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/admin.guard.ts, line: 5}
    rationale: >
      El guard decide el acceso al panel con el rol guardado en localStorage.
      Cualquiera lo cambia desde la consola del navegador
      (localStorage.setItem('role', 'admin')). Que la app tome su rol de ahi
      indica que la autoridad vive en el cliente.
  safe:
    label: safe
    rationale: >
      Mismo guard, misma ruta, mismo panel. El rol sale de /api/me, que el
      servidor resuelve a partir de la sesion: el cliente no tiene donde
      escribirlo.
