id: ng-authz-001
ecosystem: angular
family: broken-authorization
cwe: CWE-602
difficulty: obvious
source: authored
variants:
  vulnerable:
    label: vulnerable
    sink: {file: vulnerable/admin.guard.ts, line: 5}
    rationale: >
      The guard decides access to the panel with the role stored in localStorage.
      Anyone can change it from the browser console (localStorage.setItem('role',
      'admin')). The app taking its role from there means the authority lives on
      the client.
  safe:
    label: safe
    rationale: >
      Same guard, same route, same panel. The role comes from /api/me, which the
      server resolves from the session: the client has nowhere to write it.
